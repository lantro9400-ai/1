# 채널 프로필 — 채널마다 이 파일 하나를 복사해서 고치면 됩니다.
id: pungnyu
channel_name: 풍류천재조서형
pd: 정해빈
studio: friday studio        # 기획안 상단 로고 자리에 들어가는 이름
cast:
  name: 조서형
  title: 셰프
  honorific: 셰프님

# 코너에 별도 고정 인사가 없을 때 쓰는 기본 오프닝 인사
opening_greeting: "안녕하세요. 풍류천재 조서형입니다."

# 출연자 말투
voice: >-
  존댓말, 따뜻하고 친근한 구어체. "~했는데요", "~거든요", "~보시죠", "~바랄게요" 같은 말끝.
  시청자를 "여러분"이라고 부르고, 자기 경험(김치 귀신이라 불릴 정도로 김치를 좋아함 등)을 자연스럽게 섞음.
  과장된 유행어나 반말은 쓰지 않음.

# 채널 코어 내러티브 (CONTENT NOTE / PRODUCTION 체크에 사용)
narrative: >-
  조서형 셰프의 손맛과 한식의 풍류를 시청자가 "나도 저렇게 해 먹고 싶다 / 가 보고 싶다"고 느끼게 만드는 채널.
  계절감 있는 메뉴와 지역의 맛, 시청자 눈높이의 질문, 다음 편을 요청하는 커뮤니티.
