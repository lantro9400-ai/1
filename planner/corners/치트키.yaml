# 코너 템플릿 — 치트키 (셰프 요리 레시피)
# 레퍼런스: 치트키 "가장 완벽한 김장" 편 (2026-11-04 촬영, 18p)
name: 치트키
description: 셰프가 집에서 따라 하기 좋은 요리와 그 요리의 핵심 팁(치트키)을 알려 주는 레시피 코너

# 입력이 없을 때 "⬜ 미정 (지난번엔 OOO)" 으로 보여 줄 직전 회차 값
previous_values:
  director: 임태성
  location: 조서형님 자택
  call_time: 11시
  parking: 종로구 평창 21길 34

fixed_lines:
  - "안녕하세요. 풍류천재 조서형입니다."
  - "그럼 오늘의 치트키를 시작해보겠습니다."

timetable_guide: >-
  콜타임 기준 가안. 장비 체크 / 카메라·오디오 셋업 30분 → "조서형 OO 치트키" 조리 블록(activity 에 메뉴를
  "- 메뉴" 줄바꿈 목록으로) → 장비 정리 및 촬영 종료 30분. 조리 시간이 긴 메뉴를 먼저.
  레퍼런스는 11:00 콜타임, 11:30~17:00 조리, 17:00~17:30 정리였음. 콜타임이 없으면 경과 시간(0:00~0:30)으로.

scenes:
  - title: "S#1 오프닝"
    guide: >-
      composition: ["오늘의 콘텐츠 소개"]. 블록 1개.
      대사 예시는 실제 말하듯 4~6문단 분량: 고정 인사 → 왜 이 메뉴인지(계절·요청·셰프 개인 이야기)
      → 오늘 알려 드릴 메뉴 나열 → "그럼 오늘의 치트키를 시작해보겠습니다."
  - title: "S#2 [회차 테마명]"
    guide: >-
      title 은 "S#2 " + 테마명(예: "S#2 김장"). composition 은 큰 흐름 불릿(예: 준비물 소개 / 재료 소개 / 수육 삶기 / 김장).
      블록은 [준비물 소개](필요할 때) [재료 소개] [메뉴별...] [보관 · 숙성] 순서.
      line_examples 는 완성 문장이 아니라 "셰프가 짚을 포인트" 불릿 (예: 좋은 배추 고르는 법, 대체 재료 꼭 말해주기,
      정확한 계량 후 안내). 재료 소개 블록엔 대체 재료 언급 필수.
      pd_questions 는 블록별 2~9개, 시청자가 따라 하다 막히는 지점
      (예: 마트에서 뭘 보고 골라요? 집에 이 재료가 없으면? 2~3인 가족이면 몇 포기? 왜 퍽퍽해져요? 몇 근에 얼마나 삶아요?
      너무 짜면 어떻게 해요? 김치냉장고 없으면 보관은? 며칠 지나서 먹어야 제일 맛있어요?).
      지역 음식이면 지역 비교 질문(전라도 / 경상도 / 강원도 / 서울식 차이) 포함.
  - title: "S#3 시식 & 엔딩"
    guide: >-
      composition 은 시식 구성 불릿(예: 수육 & 김치 시식 / 흰 밥 & 김치, 총각무 / 엔딩) + (제안) 시식 아이디어.
      블록 1개 [ 시식 · 마무리 ]: 마무리 대사 예시(오늘 함께 해 봤다 → 시청자에게 따뜻한 한마디), PD 질문 3개.

shots_guide:
  - "main cam: 셰프 정면 바스트, 설명 컷"
  - "sub 1: 손 & 냄비 클로즈업 (회차별 핵심 장면을 구체적으로)"
  - "sub 2-1 / 2-2: 주방 와이드 풀샷"
  - "시식 main: 마주 앉아 시식하며 PD와 대화하는 컷"
