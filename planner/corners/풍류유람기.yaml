# 코너 템플릿 — 풍류유람기 (지역 맛집 투어)
# 레퍼런스: 풍류유람기 "보령, 광천" 편 (2026-11-11 촬영, 15p)
name: 풍류유람기
description: 셰프가 한 지역(또는 두 지역)의 맛집·시장을 찾아가 제철 음식과 그 지역의 맛을 소개하는 맛집 투어 코너

previous_values:
  director: 김동환, 류채영
  call_time: 9시 40분

fixed_lines:
  - "안녕하세요 여러분, 오랜만의 풍류유람기로 인사드립니다~"
  - "저는 다음 풍류유람기에서 인사드릴게요. 감사합니다!"

timetable_guide: >-
  콜타임 기준 가안. 출연자 도착·장비체크·카메라/오디오 셋업(20분) → "가게명 - 대표 메뉴" 촬영 블록(약 1시간~1시간 20분)과
  "OO로 이동" 블록(20~30분)을 번갈아 → 장비 정리 및 촬영 종료. 가게 영업시간·브레이크타임을 고려.
  가게명은 PD가 준 것만 쓰고, 정해지지 않았으면 "⬜ 미정 (제안: 지역 대표 음식)" 으로.

scenes:
  - title: "S#1 오프닝 - [지역]"
    guide: >-
      첫 방문지 앞 오프닝. composition 예: ["OO집 오프닝"]. 대사 예시: 고정 인사 → 오늘 온 지역과 이 지역을 고른 이유
      → "첫번째로 소개드릴 곳은 바로 이곳입니다" → 가게 소개 한 줄 → "한번 들어가 보시죠."
  - title: "S#N 풍류 즐기기 - [가게/장소명]"
    guide: >-
      방문지마다 신 1개씩 (S#2, S#3 ... 번호를 이어서). composition 은 이 집에서 다룰 포인트 불릿
      (메뉴 추천 / 알게 된 계기 / 타지역과 구분되는 이 지역 음식의 특징 / 지역별 차이점 / 이 집의 차별점 / 맛있게 먹는 법 / 어울리는 술).
      블록 1개(이름은 장소명), line_examples 는 셰프 대사(가게 앞 / 안에서처럼 상황 표시 가능),
      pd_questions 3~8개: 맛있는 이유, 지역 비교(서해 vs 남해 등), 집에서 재현하는 법, 셰프 개인 경험, 지역 이야기(시장·인구 소멸 등).
      시장처럼 여러 곳을 도는 신은 블록을 [시장 입구] [OO 시장] [먹거리]처럼 나눈다.
  - title: "S#N 엔딩"
    guide: >-
      지역마다 엔딩 신 1개. composition: [지역 맛집 추천 / 엔딩]. 대사: 오늘 맛본 것 정리 → 이 지역 음식의 인상
      → "추천해주고 싶으신 다른 OO 맛집이 있으시다면 댓글로 알려주세요!" → 고정 엔딩 멘트.
      두 지역이면 [오프닝 - 지역1] → 풍류 즐기기들 → [엔딩] → [오프닝 - 지역2] → 풍류 즐기기들 → 마지막 엔딩 순서.

shots_guide:
  - "main cam: 셰프 정면 바스트 (가게 앞 오프닝 / 걸으며 토크 / 가게 안)"
  - "sub 1: 음식 클로즈업, 셰프가 먹는 리액션"
  - "sub 2: 간판·거리·시장 풍경 인서트"
  - "시식 main: 마주 앉아 시식하며 PD와 대화하는 컷"
