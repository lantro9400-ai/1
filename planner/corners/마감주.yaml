# 코너 템플릿 — 마감주 (요리 + 안주 먹방)
# 레퍼런스: 마감주 "초간단 막걸리 안주" 편 (9/20 촬영, 8p)
name: 마감주
description: >-
  하루를 마감하며 건네는 위로. 냉장고 속 남은 재료로 뚝딱 차려 내는 셰프표 '냉털 안주'와 술 한 잔.
  거창한 요리는 사치, 비싼 안주는 부담인 현대인을 위한 초간단 안주 + 먹방 코너.

previous_values:
  location: 여의도 요정
  call_time: "10:50"

# 이 코너 표지에만 있는 추가 항목 (--set 라벨=값 으로 입력)
cover_extras:
  - label: 영상포맷
    default: 유튜브 롱폼 10분 내외
  - label: 브랜드명
    previous: 무가
  - label: 광고상품
    previous: "-"

fixed_lines:
  - "안녕하세요, 여러분. 풍류천재 조서형입니다."
  - "너무 빨리 끝나서 놀라실 수도 있으니 잘 따라오세요!"

timetable_guide: >-
  콜타임 기준 가안. 집결(콜타임 / 장비 체크 / 카메라·오디오 셋업) → 촬영(안주 N종, activity 에 메뉴를 "- 메뉴" 줄바꿈 목록으로,
  약 2시간) → 랩업(장비 정리 30분). note 에 장소를 적는다.

scenes:
  - title: "S#1 오프닝"
    guide: >-
      composition: [계절 맞이 오프닝 멘트 / 오늘의 시작주 소개]. 대사: 고정 인사 → 바빴던 하루, 오는 길의 계절감
      → 오늘 어울리는 술과 안주 N가지 → "너무 빨리 끝나서 놀라실 수도 있으니 잘 따라오세요!"
  - title: "S#2 마감주 레시피"
    guide: >-
      composition: [재료 소개 / 서형의 마감주 레시피]. 블록: [재료 소개] → [안주1] → [안주2] ...
      line_examples 는 포인트 불릿(서형만의 OO 포인트 강조 / 대체할 수 있는 조미료·재료 충분히 설명 / 조리법별 주의점).
      냉장고 속 남은 재료로 하는 '냉털' 느낌을 살리고, 대체 재료를 반드시 언급. pd_questions 에 술 페어링 질문 포함.
  - title: "S#3 시식 & 엔딩"
    guide: >-
      composition: [마감주(술) 소개 / 술 시음 후 강렬한 리액션 / 가장 맛있게 먹는 법 / 마무리 멘트 / 쿠키영상].
      술이 협찬이면 구매 링크 안내 멘트, 아니면 생략. 마무리 대사는 계절 + "마감주 레시피로 피곤함을 날려 보시길".
      쿠키영상 아이디어는 (제안)으로 (예: 재밌었던 댓글 읽기). PD 질문 3개.

shots_guide:
  - "메인 - 미러리스: 아이레벨, 풀샷 고정"
  - "서브 1 - 미러리스: 인물 클로즈업"
  - "서브 2 - 미러리스: 요리, 재료 인서트"
  - "기타: 현장감 보여주는 풀샷"
  - "기타: 계절감 보여주는 인서트 컷"
